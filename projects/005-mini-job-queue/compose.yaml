services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queue
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["5432:5432"]
  api:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      QUEUE_DATABASE_URL: postgresql://queue:queue@postgres:5432/queue
    ports: ["8000:8000"]
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      QUEUE_DATABASE_URL: postgresql://queue:queue@postgres:5432/queue
      QUEUE_PROCESSING_SECONDS: "10"
      QUEUE_LEASE_SECONDS: "15"
